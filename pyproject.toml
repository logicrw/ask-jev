[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ask-jev"
version = "1.0.0"
description = "Bounded advisory decisions and verbatim extractive reading view for AI coding agents and CLI pipelines"
readme = "README.md"
authors = [
    { name = "logicrw" }
]
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = [
    "ai-agent",
    "decision",
    "classification",
    "extractive-reading",
    "fail-open",
    "advisory",
    "harness",
    "subagent"
]
dependencies = []

[project.scripts]
ask-jev = "scripts.ask_jev:main"

[project.urls]
Homepage = "https://github.com/logicrw/ask-jev"
Repository = "https://github.com/logicrw/ask-jev"
Issues = "https://github.com/logicrw/ask-jev/issues"
